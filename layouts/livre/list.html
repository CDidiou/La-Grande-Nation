{{ define "main" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <p class="post-subtitle">{{ i18n "cycle" }}</p>
  </header>

  <div class="post-content">

	{{ .Content }}
    <h2>{{ i18n "contents" }}</h2>

    <ol>
      {{ range .Pages.ByWeight }}
        <li>
			<a href="{{ .RelPermalink }}">
				{{- with .Params.part -}}[{{ . }}] {{- end -}}
				&nbsp;{{ .Title }}
			</a>
        </li>
      {{ end }}
    </ol>

  </div>
</article>

{{ end }}
