{{ define "main" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  <div class="post-content">

    <p>Bienvenue dans un roman familial !</p>
	{{ .Content }}
    <h2>Sommaire</h2>

    <ol>
      {{ range .Pages.ByWeight }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ol>

  </div>
</article>

{{ end }}
